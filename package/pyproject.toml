[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aeltra-package"
description = "Aeltra OS packaging scripts and tools"
readme = {text = "Aeltra OS packaging scripts and tools", content-type = "text/plain"}
license = {text = "MIT"}
authors = [{name = "Tobias Koch", email = "tobias.koch@gmail.com"}]
keywords = ["Aeltra", "OS", "packaging", "development"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/aeltra/aeltra-distro-tools"

[tool.setuptools]
package-dir = {"" = "lib"}
packages = [
    "aeltra.package",
    "aeltra.package.aeltrapack",
    "aeltra.package.aeltrapack.helpers",
    "aeltra.package.aeltrapack.relaxng",
    "aeltra.package.deb2aeltra",
]

[tool.setuptools.package-data]
"aeltra.package.aeltrapack.helpers" = [
    "python.sh",
    "arch.sh",
]
"aeltra.package.aeltrapack.relaxng" = [
    "package.rng.xml",
]

[tool.setuptools.data-files]
"bin" = [
    "bin/aeltra-pack",
    "bin/deb2aeltra",
]
